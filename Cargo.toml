[package]
name = "r200_uhf"
version = "0.7.0"
edition = "2024"
rust-version = "1.87"
description = "Serial protocol library for R200 UHF RFID readers"
license = "MIT"
repository = "https://github.com/oniram88/r200_uhf"
readme = "README.md"
keywords = ["rfid", "uhf", "r200", "epc", "serial"]
categories = ["embedded", "hardware-support", "encoding"]
exclude = [
    "R200 user protocol V2.3.3.pdf",
    ".github/",
    "cog.toml",
]

[dependencies]
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["io-util", "time"], optional = true }

# cli-only
clap = { version = "4", features = ["derive", "env"], optional = true }
anyhow = { version = "1", optional = true }
serialport = { version = "4", optional = true }
env_logger = { version = "0.11", optional = true }
ctrlc = { version = "3", optional = true }

[features]
default = []
async = ["dep:tokio"]
cli = ["dep:clap", "dep:anyhow", "dep:serialport", "dep:env_logger", "dep:ctrlc"]
serde = ["dep:serde"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time"] }
tokio-serial = "5.4.5"
serialport = "4"
env_logger = "0.11"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
semicolon_if_nothing_returned = "warn"

[[bin]]
name = "r200"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "async_poll"
required-features = ["async"]

[[example]]
name = "sync_poll"

[[example]]
name = "hardware_in_the_loop"
